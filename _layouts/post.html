<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title }} · Jonah Park</title>
<meta name="description" content="{{ page.description | default: page.title }}">
<meta name="color-scheme" content="light">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%23f6f4ee'/%3E%3Ctext x='16' y='23' font-family='Helvetica,Arial,sans-serif' font-size='20' font-weight='600' text-anchor='middle' fill='%231d1c1a'%3EJ%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..600;1,400..600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="page">

  <header class="who">
    <h1><a href="/">Jonah Park</a></h1>
    <nav aria-label="Site">
      <a href="/projects.html">Projects</a>
      <a href="/experience.html">Experience</a>
      <a href="/blog/" aria-current="page">Blog</a>
    </nav>
  </header>

  <main>

    <article class="group post">
      <h2>{{ page.title }}</h2>
      <p class="date">{{ page.date | date: "%B %-d, %Y" }}</p>
      {{ content }}
    </article>

    <footer>Princeton University, Class of 2030</footer>

  </main>
</div>
</body>
</html>
